openapi: 3.0.3
info:
  title: Custom Validation Test
  version: 1.0.0
  description: Test x-validation extension with validation:transform Hook

paths:
  /products:
    post:
      operationId: createProduct
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

components:
  schemas:
    Product:
      type: object
      required:
        - sku
        - name
        - price
      properties:
        sku:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[A-Z0-9-]+$'
          description: Product SKU with custom validation
          x-validation: "validateSKUFormat"
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Product name (no custom validation)
        price:
          type: number
          minimum: 0
          description: Product price with custom validation
          x-validation: "validatePositivePrice"
        email:
          type: string
          format: email
          description: Contact email with custom validation
          x-validation: "validateBusinessEmail"
