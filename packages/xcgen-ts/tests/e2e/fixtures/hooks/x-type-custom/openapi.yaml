openapi: 3.0.3
info:
  title: Custom Type Test
  version: 1.0.0
  description: Test x-type extension with property:generate Hook

paths:
  /users/{userId}:
    get:
      operationId: getUser
      summary: Get user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

components:
  schemas:
    User:
      type: object
      required:
        - userId
        - email
        - username
      properties:
        userId:
          type: string
          description: User ID
          x-type: "UserId"
        email:
          type: string
          format: email
          description: Email address
          x-type: "EmailAddress"
        username:
          type: string
          minLength: 3
          maxLength: 20
          description: Username (no custom type)
        phoneNumber:
          type: string
          description: Optional phone number
          x-type: "PhoneNumber"
