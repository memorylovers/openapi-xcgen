openapi: 3.0.3
info:
  title: Custom Function Name Test
  version: 1.0.0
  description: Test x-function-name extension with endpoint:generate Hook

paths:
  /users:
    get:
      operationId: getUsers
      summary: Get all users
      x-function-name: "listAllUsers"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      operationId: createUser
      summary: Create a new user
      x-function-name: "addNewUser"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{userId}:
    get:
      operationId: getUserById
      summary: Get user by ID (no custom name)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

components:
  schemas:
    User:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
        email:
          type: string
          format: email

    CreateUserRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
