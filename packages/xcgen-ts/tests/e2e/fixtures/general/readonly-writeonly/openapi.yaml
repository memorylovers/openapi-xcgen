openapi: 3.0.0
info:
  title: ReadOnly/WriteOnly Test API
  version: 1.0.0
  description: API for testing readOnly and writeOnly properties

paths:
  /users:
    post:
      operationId: createUser
      summary: Create a new user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{userId}:
    get:
      operationId: getUser
      summary: Get user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    patch:
      operationId: updateUser
      summary: Update user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

components:
  schemas:
    User:
      type: object
      description: User model with readOnly fields
      properties:
        id:
          type: string
          description: User ID (generated by server)
          readOnly: true
        username:
          type: string
          description: Username
        email:
          type: string
          format: email
          description: Email address
        createdAt:
          type: string
          format: date-time
          description: Account creation timestamp
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          readOnly: true
      required:
        - id
        - username
        - email

    UserCreate:
      type: object
      description: User creation model with writeOnly fields
      properties:
        username:
          type: string
          description: Username
        email:
          type: string
          format: email
          description: Email address
        password:
          type: string
          format: password
          description: Password (not returned in responses)
          writeOnly: true
        confirmPassword:
          type: string
          format: password
          description: Password confirmation
          writeOnly: true
      required:
        - username
        - email
        - password
        - confirmPassword

    UserUpdate:
      type: object
      description: User update model with both readOnly and writeOnly fields
      properties:
        username:
          type: string
          description: Username
        email:
          type: string
          format: email
          description: Email address
        currentPassword:
          type: string
          format: password
          description: Current password for verification
          writeOnly: true
        newPassword:
          type: string
          format: password
          description: New password
          writeOnly: true
        lastLoginAt:
          type: string
          format: date-time
          description: Last login timestamp (server-managed)
          readOnly: true
