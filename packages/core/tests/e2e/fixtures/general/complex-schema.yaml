openapi: 3.1.0
info:
  title: Complex Schema API
  version: 1.0.0
  description: API with complex nested schemas

paths:
  /orders:
    post:
      operationId: createOrder
      summary: Create a new order
      tags:
        - orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

components:
  schemas:
    Order:
      type: object
      required:
        - id
        - items
        - customer
      properties:
        id:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - productId
              - quantity
            properties:
              productId:
                type: string
              quantity:
                type: integer
                minimum: 1
              price:
                type: number
                format: float
              discount:
                type: number
                format: float
                minimum: 0
                maximum: 100
        customer:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
              format: email
            address:
              type: object
              properties:
                street:
                  type: string
                city:
                  type: string
                country:
                  type: string
                zipCode:
                  type: string
                  pattern: '^\d{5}(-\d{4})?$'
        status:
          type: string
          enum:
            - pending
            - processing
            - shipped
            - delivered
            - cancelled
        priority:
          type: string
          enum:
            - low
            - normal
            - high
            - urgent
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time