openapi: 3.0.0
info:
  title: Validation and Metadata Test API
  version: 1.0.0
  description: Test API for validation constraints, x-extensions, and metadata on properties and parameters

components:
  schemas:
    UserProfile:
      type: object
      description: User profile with comprehensive metadata
      properties:
        id:
          type: integer
          format: int64
          description: Unique user identifier
          readOnly: true
          x-database-column: user_id
          x-primary-key: true
        username:
          type: string
          description: Username for login
          minLength: 3
          maxLength: 20
          pattern: ^[a-zA-Z0-9_]+$
          x-validation-message: Username must be 3-20 alphanumeric characters or underscore
        email:
          type: string
          format: email
          description: User email address
          maxLength: 100
          x-unique: true
          x-format: rfc5322
        age:
          type: integer
          description: User age
          minimum: 0
          maximum: 150
          default: 18
          x-unit: years
        score:
          type: number
          format: double
          description: User score
          minimum: 0.0
          maximum: 100.0
          multipleOf: 0.5
          x-precision: 1
        bio:
          type: string
          description: User biography
          maxLength: 500
          writeOnly: true
          x-encrypted: true
        status:
          type: string
          enum: [active, inactive, suspended]
          default: active
          description: Account status
          deprecated: true
          x-deprecated-reason: Use accountState instead
        accountState:
          type: string
          enum: [active, inactive, suspended, deleted]
          default: active
          description: Current account state
      required:
        - username
        - email

paths:
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: User ID
        schema:
          type: integer
          format: int64
          minimum: 1
        x-route-param: true
    get:
      operationId: getUserById
      summary: Get user by ID
      description: Retrieves a user profile by ID
      parameters:
        - name: fields
          in: query
          description: Comma-separated list of fields to include
          schema:
            type: string
            pattern: ^[a-z,]+$
            default: id,username,email
          x-example: id,username,email,age
        - name: includeDeleted
          in: query
          description: Include deleted users
          schema:
            type: boolean
            default: false
          deprecated: true
          x-deprecated-since: 1.5.0
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          description: User not found

  /users:
    get:
      operationId: listUsers
      summary: List users
      description: List all users with pagination
      parameters:
        - name: limit
          in: query
          description: Maximum number of results
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          x-pagination: true
        - name: offset
          in: query
          description: Pagination offset
          schema:
            type: integer
            minimum: 0
            default: 0
          x-pagination: true
        - name: sortBy
          in: query
          description: Field to sort by
          schema:
            type: string
            enum: [id, username, email, created_at]
            default: id
          x-sort-field: true
        - name: order
          in: query
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          x-sort-order: true
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserProfile'

    post:
      operationId: createUser
      summary: Create user
      description: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 20
                  pattern: ^[a-zA-Z0-9_]+$
                  x-validation-message: Username must be 3-20 characters
                email:
                  type: string
                  format: email
                  maxLength: 100
                  x-unique: true
                age:
                  type: integer
                  minimum: 0
                  maximum: 150
                  default: 18
                bio:
                  type: string
                  maxLength: 500
                  writeOnly: true
              required:
                - username
                - email
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
