openapi: 3.1.0
info:
  title: Validation Test API
  version: 1.0.0
  description: API for testing validation constraints

paths:
  /users:
    post:
      summary: Create a user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

components:
  schemas:
    User:
      type: object
      required:
        - id
        - username
        - email
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique user identifier
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[a-zA-Z0-9_]+$'
          description: Username (3-20 chars, alphanumeric and underscore)
        email:
          type: string
          format: email
          description: User email address
        age:
          type: integer
          minimum: 0
          maximum: 150
          nullable: true
          description: User age (0-150 years)
        bio:
          type: string
          maxLength: 500
          description: User biography (max 500 chars)
        website:
          type: string
          format: uri
          nullable: true
          description: User website URL

    CreateUserRequest:
      type: object
      required:
        - username
        - email
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[a-zA-Z0-9_]+$'
        email:
          type: string
          format: email
        age:
          type: integer
          minimum: 0
          maximum: 150
        bio:
          type: string
          maxLength: 500
        website:
          type: string
          format: uri
