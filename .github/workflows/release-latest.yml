name: Release

# Triggered by git tag push (created by `pnpm release` or `pnpm release:rc`)
# This workflow publishes packages to npm and creates GitHub Release
on:
  push:
    tags:
      - "@*/*@*" # @openapi-xcgen/core@1.0.0 など
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run mode (skip actual npm publish and GitHub release)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

env:
  TAG_VERSION: ""

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - run: echo "TAG_VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          cache: "pnpm"
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Publish to npm (Dry Run)
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "🔍 DRY RUN MODE: Skipping actual npm publish"
          pnpm lerna publish from-git --yes --no-push --no-git-tag-version --no-git-reset || echo "Dry run completed"

      - name: Publish to npm
        if: ${{ inputs.dry_run != true }}
        run: |
          # タグからパッケージ名を抽出
          PACKAGE=$(echo "${{ env.TAG_VERSION }}" | sed 's/@[^@]*$//')

          # タグからバージョンを抽出
          VERSION=$(echo "${{ env.TAG_VERSION }}" | grep -oP '@\K[^@]+$')

          # プレリリース識別子を抽出（alpha, beta, rc, など）
          if [[ $VERSION =~ -([a-z]+)[0-9]*(\.|$) ]]; then
            PRERELEASE_TAG="${BASH_REMATCH[1]}"
            echo "📦 Publishing $PACKAGE (prerelease) with dist-tag=$PRERELEASE_TAG"
            pnpm lerna publish from-git --scope "$PACKAGE" --yes --dist-tag "$PRERELEASE_TAG"
          else
            echo "📦 Publishing $PACKAGE (stable) with dist-tag=latest"
            pnpm lerna publish from-git --scope "$PACKAGE" --yes
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release (Dry Run)
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "🔍 DRY RUN MODE: Skipping GitHub release creation"
          echo "Would create release for tag: ${{ env.TAG_VERSION }}"

      - name: Create GitHub Release
        if: ${{ inputs.dry_run != true }}
        run: gh release create "${{ env.TAG_VERSION }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
