name: Release Canary

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (skip actual npm publish)'
        required: false
        type: boolean
        default: true

jobs:
  release-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          cache: 'pnpm'
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Publish canary to npm (Dry Run)
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "🔍 DRY RUN MODE: Skipping actual canary publish"
          pnpm lerna publish --canary --preid rc --dist-tag rc --yes --no-push --no-git-tag-version --no-git-reset || echo "Dry run completed"

      - name: Publish canary to npm
        if: ${{ inputs.dry_run != true }}
        run: pnpm lerna publish --canary --preid rc --dist-tag rc --yes --no-git-tag-version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
